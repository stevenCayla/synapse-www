name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  target:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      branch: ${{ steps.target.outputs.branch }}
      deploy: ${{ steps.target.outputs.deploy }}
    steps:
      # develop (push or manual run) → dev-www. main → synapse-medical.fr, but ONLY through
      # a manual run: the plan has no "required reviewers" environment rule, so
      # running the workflow by hand on main is the approval gate. A push to
      # main, other branches and pull requests are only built.
      - name: Determine target branch
        id: target
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) branch="$GITHUB_HEAD_REF" ;;
            *)            branch="$GITHUB_REF_NAME" ;;
          esac
          deploy=false
          case "$GITHUB_EVENT_NAME:$branch" in
            push:develop|workflow_dispatch:develop|workflow_dispatch:main) deploy=true ;;
          esac
          {
            echo "branch=$branch"
            echo "deploy=$deploy"
          } >> "$GITHUB_OUTPUT"
          echo "Branch: $branch — deploy: $deploy"

  build:
    needs: target
    timeout-minutes: 10
    if: ${{ !cancelled() && needs.target.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm audit --audit-level=high

      - run: npm test

      - run: npm run build

      - name: Upload build
        if: needs.target.outputs.deploy == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy:
    needs: [target, build]
    timeout-minutes: 10
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.target.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    # production is reached only by a manual run on main (see the target job).
    environment:
      name: ${{ needs.target.outputs.branch == 'main' && 'production' || 'development' }}
      url: ${{ needs.target.outputs.branch == 'main' && 'https://synapse-medical.fr' || 'https://dev-www.synapse-medical.fr' }}
    concurrency:
      group: deploy-${{ needs.target.outputs.branch }}
      cancel-in-progress: false
    steps:
      - name: Checkout site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: sh scripts/deploy.sh ${{ needs.target.outputs.branch == 'main' && 'prod' || 'dev' }}
